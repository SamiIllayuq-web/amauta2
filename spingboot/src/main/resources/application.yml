server:
  port: 4040

spring:
  application:
    name: admision-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/admision_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
jwt:
  secret: Aamauta2024SecretKeyParaFirmarTokensJWTMuyLargoYSeguro12345678901234567890
  expiration-ms: 86400000

# Logging
logging:
  level:
    com.amauta: INFO
    org.springframework.security: INFO
